<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/en/">
  <title>ORXU</title>
  <meta name="description" content="ORXU institutional website. Choose language: English or Português.">
  <meta name="robots" content="index, follow">
  <script>
    (function () {
      try {
        var lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
        if (lang.indexOf("pt") === 0) {
          window.location.replace("/pt/");
          return;
        }
      } catch (e) {}
      window.location.replace("/en/");
    })();
  </script>
</head>
<body>
  <p>Redirecting… <a href="/en/">English</a> · <a href="/pt/">Português</a></p>
</body>
</html>
